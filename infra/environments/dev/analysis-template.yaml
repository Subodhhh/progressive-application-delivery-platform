apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: releaseforge-success-rate
  namespace: releaseforge
spec:
  args:
    - name: service-name

  metrics:
    - name: error-rate
      interval: 30s
      count: 3
      successCondition: result[0] <= 0.05
      failureLimit: 1
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            (
              sum(
                rate(
                  http_requests_total{
                    service="{{args.service-name}}",
                    path="/payment",
                    status_code=~"5.."
                  }[2m]
                )
              )
              OR on() vector(0)
            )
            /
            (
              sum(
                rate(
                  http_requests_total{
                    service="{{args.service-name}}",
                    path="/payment"
                  }[2m]
                )
              )
              OR on() vector(1)
            )

    - name: latency-p95
      interval: 30s
      count: 3
      successCondition: result[0] <= 1.0
      failureLimit: 1
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(
              0.95,
              sum(
                rate(
                  http_request_duration_seconds_bucket{
                    service="{{args.service-name}}",
                    path="/payment"
                  }[2m]
                )
              ) by (le)
            )
