apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: releaseforge-ingress
  namespace: releaseforge
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: releaseforge-app
                port:
                  number: 80
