name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: flake8 app/ --max-line-length=100 --ignore=E501

      - name: Run tests
        run: python -m pytest tests/ -v

  build-scan-push:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/releaseforge-app:${{ github.sha }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/releaseforge-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/releaseforge-app:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/releaseforge-app:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Push image
        if: success()
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/releaseforge-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/releaseforge-app:latest